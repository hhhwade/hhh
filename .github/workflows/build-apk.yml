name: Build Android APK & iOS Preview

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check Directory Structure
        run: ls -la && find . -maxdepth 2

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -d "pixel-me-app" ]; then
            cd pixel-me-app && npm install
          else
            echo "Error: package.json not found!" && exit 1
          fi

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK via EAS
        run: |
          if [ -d "pixel-me-app" ]; then
            cd pixel-me-app
          fi
          eas build --platform android --profile preview --non-interactive
